<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survive Gus's PlayPlace — Art Preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05040a; overflow: hidden; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #bar {
      position: fixed; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 70vw;
    }
    #bar button {
      background: rgba(20, 16, 40, 0.8); color: #ffd23f; border: 1px solid #5b2a86;
      border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer;
    }
    #bar button.on { background: #ff3fa4; color: #fff; }
    #hint { position: fixed; right: 10px; bottom: 8px; color: #8a84a0; font-size: 11px; }
    body.clean #bar, body.clean #hint { display: none; }
    body.cam canvas { filter: saturate(0.35) sepia(0.25) hue-rotate(70deg) contrast(1.15) brightness(1.1); }
  </style>
  <script type="importmap">
    { "imports": { "three": "../vendor/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="bar"></div>
  <div id="hint">Drag to look · WASD to fly · Q/E down/up · ?shot=name&amp;clean=1 for screenshots</div>
  <script type="module" src="preview.js"></script>
</body>
</html>
